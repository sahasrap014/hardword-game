<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF8">
        <meta name="viewport" content="width=device-width">
        <title>table html</title> 
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--unordered list-->
        <h3>stationery supplies</h3>
        <ul>
            <li>pen</li>
            <li>eraser</li>
            <li>scale</li>
            <li>geometry</li>
            <ul>
                <li>protractor</li>
                <li>compass</li>
            </ul>
        </ul>
        <!--ordered list-->
        <h3>alphabet</h3>
        <ol>
            <li>apple</li>
            <li>
                ball
            </li>
            <ul>
                <li>cat</li>
            </ul>
            
        </ol>
        <!--Description list-->
        <h3>Dictionary</h3>
        <dl style="background-color:rgb(153, 210, 96);border: 2px solid;"">
            <dt>monkey</dt>
            <dd>an animal</dd>
            <dt>parrot</dt>
            <dd>a bird</dd>
            
        </dl>
        <h2>table</h2>
        <table border="5">
        <tr style="background-color: aquamarine;">
            <th width="100">one</th>
            <th width="100">two</th>
            <th width="100">three</th>
            <th width="100">four</th>
        </tr>
        <tr align="center" style="border-color: blue ;">
            <td >sunday</td>
            <td>monday</td>
            <td>tues</td>
            <td>D</td>

        </tr>
        <tr>
            <td>holiday</td>
            <td>torture</td>   
        </tr>
        </table>
        
    </body>
</html>
